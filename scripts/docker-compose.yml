name: agent-brain

services:
  agent-brain-api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: agent-brain-api:local
    container_name: agent-brain-api
    restart: unless-stopped
    environment:
      ADDR: ":8220"
      SQLITE_PATH: /data/agent_brain.db
      JWT_SECRET: dev-agent-brain-jwt-change-me
      MIGRATIONS_DIR: migrations
    volumes:
      - agent_brain_sqlite:/data
    ports:
      - "5090:8220"
    networks:
      - default

  agent-brain-webui:
    build:
      context: ../webui
      dockerfile: Dockerfile
    image: agent-brain-webui:local
    container_name: agent-brain-webui
    restart: unless-stopped
    depends_on:
      - agent-brain-api
    ports:
      - "5091:80"
    networks:
      - default

volumes:
  agent_brain_sqlite:
